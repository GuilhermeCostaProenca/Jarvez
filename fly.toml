app = 'jarvez-core'
primary_region = 'gru'

[env]
  HA_BASE_URL = 'https://homeassistant.local/api/webhook'
  HA_WEBHOOK_TOKEN = 'change-me'
  JARVEZ_API_KEY = 'change-me'
  JARVEZ_ENV = 'production'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
